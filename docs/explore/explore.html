<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Explore · T&amp;L Digital POD</title>
<script src="../js/theme.js"></script>
<script src="../js/config.js"></script>
<script src="../js/datasets.js"></script>
<link rel="stylesheet" href="../css/design-system.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { font-family: var(--font-ui); cursor: pointer; }

/* ── PAGE SHELL ── */
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── TOP BAR ── */
.topbar {
  background: var(--header-bg);
  height: 52px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
  z-index: 200;
}
.topbar-back {
  color: var(--sb-text-2);
  text-decoration: none;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: color .12s;
}
.topbar-back:hover { color: #fff; }
.topbar-sep { color: rgba(255,255,255,.25); font-size: 15px; }
.topbar-title { color: #fff; font-weight: 600; font-size: 15px; }
.topbar-badge {
  background: rgba(255,255,255,.1);
  color: var(--sb-text-2);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 2px 7px;
  border-radius: 4px;
}
.topbar-spacer { flex: 1; }
.tb-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 13px;
  font-weight: 500;
  transition: background .12s, opacity .12s;
  white-space: nowrap;
}
.tb-btn-ghost  { background: rgba(255,255,255,.08); color: var(--sb-text); }
.tb-btn-ghost:hover { background: rgba(255,255,255,.15); }
.tb-btn-primary { background: var(--accent); color: #fff; }
.tb-btn-primary:hover { background: var(--accent-hover); }
.tb-btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.tb-btn-outline { background: transparent; color: var(--sb-text-2); border: 1px solid rgba(255,255,255,.15); }
.tb-btn-outline:hover { background: rgba(255,255,255,.08); }
.tb-btn-outline:disabled { opacity: .35; cursor: not-allowed; }

/* ── BODY LAYOUT ── */
.page-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 256px;
  min-width: 256px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sb-section {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.sb-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
  margin-bottom: 8px;
}

/* Dataset cards */
.ds-card {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .12s, border-color .12s;
}
.ds-card + .ds-card { margin-top: 4px; }
.ds-card:hover { background: var(--surface-alt); }
.ds-card.active {
  background: var(--accent-light, rgba(37,99,235,.08));
  border-color: var(--accent);
}
.ds-icon { font-size: 17px; line-height: 1; padding-top: 1px; }
.ds-name { font-size: 13px; font-weight: 500; }
.ds-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.ds-count {
  margin-top: 4px;
  font-size: 10px;
  font-family: var(--mono);
  color: var(--ok);
  display: none;
}
.ds-card.loaded .ds-count { display: block; }

/* Field list */
.field-list { display: flex; flex-direction: column; gap: 1px; }
.field-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12.5px;
  color: var(--text-2);
  transition: background .1s, color .1s;
  user-select: none;
}
.field-item:hover { background: var(--surface-alt); color: var(--text); }
.field-item.in-use { color: var(--accent); font-weight: 500; }
.field-item .fi-icon {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
  color: var(--muted);
  transition: background .1s, color .1s, border-color .1s;
}
.field-item:hover .fi-icon,
.field-item.in-use .fi-icon { background: var(--accent); color: #fff; border-color: var(--accent); }
.fi-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi-type {
  font-size: 9.5px;
  color: var(--muted);
  background: var(--surface-alt);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--mono);
  flex-shrink: 0;
}
.field-item.in-use .fi-type { background: rgba(37,99,235,.1); color: var(--accent); }

/* ── MAIN CONTENT ── */
.main-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── CONFIG PANEL ── */
.config-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  flex-shrink: 0;
  display: none;
}
.config-row {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.config-zone { flex: 1; min-width: 200px; }
.cz-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
  margin-bottom: 7px;
}
.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  min-height: 30px;
}

/* Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px 3px 11px;
  border-radius: 20px;
  font-size: 12px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill-dim {
  background: rgba(37,99,235,.08);
  border-color: rgba(37,99,235,.3);
  color: var(--accent);
}
.pill-metric {
  background: rgba(5,150,105,.07);
  border-color: rgba(5,150,105,.3);
  color: var(--ok);
}
.pill-rm {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: inherit;
  opacity: .55;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
  padding: 0;
  transition: opacity .1s, background .1s;
}
.pill-rm:hover { opacity: 1; background: rgba(0,0,0,.1); }
.pill .agg-sel {
  background: transparent;
  border: none;
  outline: none;
  font-size: 11px;
  font-weight: 600;
  color: inherit;
  font-family: var(--font-ui);
  padding: 0;
  cursor: pointer;
  margin-right: 2px;
}

/* Add button */
.add-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px dashed var(--border);
  background: transparent;
  transition: color .1s, border-color .1s;
}
.add-pill:hover { color: var(--accent); border-color: var(--accent); }

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: none;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  flex-shrink: 0;
}
.fb-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
  margin-right: 2px;
  white-space: nowrap;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--text-2);
}
.filter-chip select,
.filter-chip input[type="text"] {
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  color: var(--text);
  font-family: var(--font-ui);
}
.filter-chip select { max-width: 150px; }
.filter-chip input[type="text"] { width: 110px; }
.fc-sep { color: var(--muted); padding: 0 1px; }

/* ── RESULTS AREA ── */
.results-area {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

/* Empty / loading */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 60px 24px;
  text-align: center;
  color: var(--muted);
}
.es-icon { font-size: 52px; opacity: .35; }
.es-title { font-size: 17px; font-weight: 600; color: var(--text); }
.es-desc  { font-size: 14px; max-width: 360px; line-height: 1.6; }
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Results toolbar */
.results-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.rc-count { font-size: 13px; color: var(--muted); }
.rc-count strong { color: var(--text); font-weight: 600; }
.view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.vt-btn {
  padding: 4px 13px;
  background: transparent;
  border: none;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-ui);
  transition: background .1s, color .1s;
}
.vt-btn.active { background: var(--accent); color: #fff; }
.res-spacer { flex: 1; }
.export-btn {
  padding: 5px 13px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background .1s, border-color .1s;
}
.export-btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }

/* Table */
.table-wrap {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface-alt);
  padding: 9px 14px;
  text-align: left;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--text); }
thead th.sort-asc::after  { content: " ↑"; color: var(--accent); }
thead th.sort-desc::after { content: " ↓"; color: var(--accent); }
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface-alt); }
tbody td { padding: 8px 14px; }
td.num { text-align: right; font-family: var(--mono); font-size: 12.5px; color: var(--text); }
tfoot tr td {
  background: var(--surface-alt);
  padding: 8px 14px;
  font-weight: 700;
  border-top: 2px solid var(--border);
  font-size: 12.5px;
}
tfoot td.num { text-align: right; font-family: var(--mono); }

/* Null / empty cell */
td.null-cell { color: var(--muted); font-style: italic; font-size: 12px; }

/* Bar chart */
.bar-chart-wrap { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.br-label {
  width: 200px;
  text-align: right;
  color: var(--text-2);
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.br-track {
  flex: 1;
  background: var(--surface-alt);
  border-radius: 4px;
  height: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.br-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  min-width: 2px;
}
.br-value { width: 90px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 4px;
}
.pg-btn {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 12px;
  color: var(--text-2);
  transition: background .1s;
}
.pg-btn:hover:not(:disabled) { background: var(--surface-alt); }
.pg-btn:disabled { opacity: .35; cursor: not-allowed; }
.pg-info { font-size: 12px; color: var(--muted); }

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
  .sidebar { display: none; }
  .config-row { gap: 12px; }
  .br-label { width: 120px; }
}
</style>
</head>
<body>

<!-- ────────────── TOP BAR ────────────── -->
<header class="topbar">
  <img src="../assets/logo-on-dark.svg" alt="T&amp;L Digital" height="28" style="display:block;flex-shrink:0;margin-right:4px" />
  <span class="topbar-sep">›</span>
  <a class="topbar-back" href="..">Dashboards</a>
  <span class="topbar-sep">›</span>
  <span class="topbar-title">Explore</span>
  <span class="topbar-badge">Beta</span>
  <span class="topbar-spacer"></span>
  <button class="tb-btn tb-btn-ghost" id="btn-clear">Clear</button>
  <button class="tb-btn tb-btn-primary" id="btn-run" disabled>▶ Run</button>
  <button class="tb-btn tb-btn-outline" id="btn-export" disabled>↓ CSV</button>
</header>

<!-- ────────────── PAGE BODY ────────────── -->
<div class="page-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <!-- Datasets -->
    <div class="sb-section">
      <div class="sb-label">Data Source</div>
      <div id="ds-list"></div>
    </div>

    <!-- Dimensions -->
    <div class="sb-section" id="sb-dims" style="display:none;">
      <div class="sb-label">Dimensions</div>
      <div class="field-list" id="dims-list"></div>
    </div>

    <!-- Metrics -->
    <div class="sb-section" id="sb-metrics" style="display:none;">
      <div class="sb-label">Metrics</div>
      <div class="field-list" id="metrics-list"></div>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="main-col">

    <!-- Config -->
    <div class="config-panel" id="config-panel">
      <div class="config-row">
        <div class="config-zone">
          <div class="cz-label">Row Groups (Group By)</div>
          <div class="pill-row" id="rg-pills"></div>
        </div>
        <div class="config-zone">
          <div class="cz-label">Values (Metrics)</div>
          <div class="pill-row" id="val-pills"></div>
        </div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar" id="filter-bar">
      <span class="fb-label">Filters</span>
      <div id="filter-chips" style="display:contents;"></div>
      <button class="add-pill" onclick="addFilter()">+ Add filter</button>
    </div>

    <!-- Results -->
    <div class="results-area" id="results-area">
      <div class="empty-state" id="empty-state">
        <div class="es-icon">🔍</div>
        <div class="es-title">Start Exploring</div>
        <div class="es-desc" id="empty-desc">
          Select a data source from the sidebar, pick dimensions to group by and
          metrics to measure, then click <strong>Run</strong>.
        </div>
      </div>
      <div id="results-content" style="display:none; flex-direction:column; gap:14px;"></div>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     DATA CATALOG
════════════════════════════════════════════════════════════ -->
<script>
const CATALOG = {
  orders: {
    label: "Orders",
    icon:  "🛒",
    desc:  "POD order transactions · Etsy & Shopify",
    async load() {
      const r = await fetch("../data/orders.json");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    },
    dimensions: [
      { key: "order_date", label: "Order Date",  typeTag: "date"   },
      { key: "source",     label: "Source",      typeTag: "string" },
      { key: "status",     label: "Status",      typeTag: "string" },
      { key: "order_id",   label: "Order ID",    typeTag: "string" },
    ],
    metrics: [
      { key: "_count",    label: "# Orders",           typeTag: "count",  defaultAgg: "count" },
      { key: "total_usd", label: "Order Value (USD)",   typeTag: "number", defaultAgg: "sum"   },
    ],
  },

  revenue: {
    label: "Revenue by Source",
    icon:  "💰",
    desc:  "Monthly revenue by sales channel",
    async load() {
      const r = await fetch("../data/revenue.json");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    },
    dimensions: [
      { key: "period", label: "Period",  typeTag: "date"   },
      { key: "source", label: "Source",  typeTag: "string" },
    ],
    metrics: [
      { key: "_count",      label: "# Rows",       typeTag: "count",  defaultAgg: "count" },
      { key: "revenue_usd", label: "Revenue (USD)", typeTag: "number", defaultAgg: "sum"   },
    ],
  },

  qualtrics: {
    label: "Owner Sentiment",
    icon:  "📋",
    desc:  "Qualtrics survey · CW owner satisfaction & sentiment",
    async load() {
      const r = await fetch("../data/owner_sentiment.json");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    },
    dimensions: [
      { key: "survey_date",    label: "Survey Date",    typeTag: "date"   },
      { key: "brand",          label: "Brand",          typeTag: "string" },
      { key: "channel",        label: "Channel",        typeTag: "string" },
      { key: "sentiment",      label: "Sentiment",      typeTag: "string" },
      { key: "purpose",        label: "Purpose",        typeTag: "string" },
      { key: "ease_rating",    label: "Ease Rating",    typeTag: "string" },
      { key: "achieved_goal",  label: "Achieved Goal",  typeTag: "string" },
    ],
    metrics: [
      { key: "_count",             label: "# Responses",        typeTag: "count",  defaultAgg: "count" },
      { key: "satisfaction_score", label: "Satisfaction Score",  typeTag: "number", defaultAgg: "avg"   },
    ],
  },

  voya: {
    label: "Voya Conversations",
    icon:  "💬",
    desc:  "Chat records · sentiment, outcomes & engagement",
    async load() {
      if (typeof DATASET !== "undefined" && Array.isArray(DATASET)) return DATASET;
      return new Promise((resolve, reject) => {
        const s   = document.createElement("script");
        s.src     = "../js/voya_backend_dataset_rebuilt.js";
        s.onload  = () => resolve(typeof DATASET !== "undefined" ? DATASET : []);
        s.onerror = () => reject(new Error("Could not load Voya dataset"));
        document.head.appendChild(s);
      });
    },
    dimensions: [
      { key: "sentiment",        label: "Sentiment",         typeTag: "string" },
      { key: "outcome",          label: "Outcome",           typeTag: "string" },
      { key: "goal_category",    label: "Goal Category",     typeTag: "string" },
      { key: "membership_level", label: "Membership Level",  typeTag: "string" },
      { key: "week_start",       label: "Week",              typeTag: "date"   },
      { key: "engaged user",     label: "Engagement Status", typeTag: "string" },
      { key: "site_id",          label: "Site ID",           typeTag: "string" },
    ],
    metrics: [
      { key: "_count",           label: "# Conversations",   typeTag: "count",  defaultAgg: "count" },
      { key: "duration_s",       label: "Duration (sec)",    typeTag: "number", defaultAgg: "avg"   },
      { key: "user_satisfaction",label: "User Satisfaction", typeTag: "number", defaultAgg: "avg"   },
      { key: "action_count",     label: "Actions Taken",     typeTag: "number", defaultAgg: "sum"   },
      { key: "Agent_responses",  label: "Agent Responses",   typeTag: "number", defaultAgg: "avg"   },
      { key: "User_responses",   label: "User Responses",    typeTag: "number", defaultAgg: "avg"   },
      { key: "sentiment_score",  label: "Sentiment Score",   typeTag: "number", defaultAgg: "avg"   },
    ],
  },
};
</script>

<!-- ═══════════════════════════════════════════════════════════
     APP STATE & CONSTANTS
════════════════════════════════════════════════════════════ -->
<script>
const AGG_OPTS   = ["count","sum","avg","min","max","countd"];
const AGG_LABEL  = { count:"COUNT", sum:"SUM", avg:"AVG", min:"MIN", max:"MAX", countd:"CNTD" };
const FILTER_OPS = ["=","≠","contains","not contains",">","<","≥","≤","between","is blank","is not blank"];

const ST = {
  dsKey:        null,
  records:      [],
  loadStatus:   "idle",   // idle | loading | ready | error
  rowGroups:    [],        // dim keys
  valMetrics:   [],        // { key, agg, label }
  filters:      [],        // { id, field, op, value }
  nextFid:      0,
  sortCol:      null,
  sortDir:      "asc",
  results:      [],
  page:         0,
  pageSize:     100,
  viewMode:     "table",   // table | bar
};

function ds() { return CATALOG[ST.dsKey]; }
function allFields() {
  if (!ST.dsKey) return [];
  return [...ds().dimensions, ...ds().metrics.filter(m => m.key !== "_count")];
}
function colKey(m)   { return m.key + "__" + m.agg; }
function colLabel(m) { return AGG_LABEL[m.agg] + "(" + m.label + ")"; }
</script>

<!-- ═══════════════════════════════════════════════════════════
     SIDEBAR RENDERING
════════════════════════════════════════════════════════════ -->
<script>
function buildDatasetList() {
  const list = document.getElementById("ds-list");
  list.innerHTML = "";
  Object.entries(CATALOG).forEach(([key, catalog]) => {
    if (document.getElementById("ds-card-" + key)) return; // already rendered
    const card = document.createElement("div");
    card.className   = "ds-card";
    card.id          = "ds-card-" + key;
    card.dataset.key = key;
    card.innerHTML   = `
      <span class="ds-icon">${catalog.icon}</span>
      <div>
        <div class="ds-name">${catalog.label}</div>
        <div class="ds-meta">${catalog.desc}</div>
        <div class="ds-count" id="ds-count-${key}"></div>
      </div>`;
    card.addEventListener("click", () => selectDataset(key));
    list.appendChild(card);
  });
}
buildDatasetList();

/** Pull the backend registry and add any unknown datasets to the CATALOG. */
async function initDynamicDatasets() {
  const registry = await DatasetLoader.getRegistry();
  if (!registry.length) return;

  let added = false;
  registry.forEach(meta => {
    if (CATALOG[meta.name]) return; // don't shadow hardcoded entries
    CATALOG[meta.name] = {
      label:   meta.name.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()),
      icon:    "📂",
      desc:    `${meta.row_count.toLocaleString()} rows · ${meta.source_filename}`,
      _dynamic: true,
      async load() {
        return DatasetLoader.getRecords(meta.name);
      },
      // Schema is empty — will be auto-detected after first load.
      dimensions: [],
      metrics:    [],
    };
    added = true;
  });

  if (added) buildDatasetList();
}
initDynamicDatasets();

function renderSidebarFields(catalog) {
  const dimList = document.getElementById("dims-list");
  const metList = document.getElementById("metrics-list");
  dimList.innerHTML = "";
  metList.innerHTML = "";

  catalog.dimensions.forEach(f => dimList.appendChild(makeFieldItem(f, "dim")));
  catalog.metrics.forEach(f    => metList.appendChild(makeFieldItem(f, "metric")));

  document.getElementById("sb-dims").style.display    = "";
  document.getElementById("sb-metrics").style.display = "";
}

function makeFieldItem(field, kind) {
  const el = document.createElement("div");
  el.className     = "field-item";
  el.dataset.key   = field.key;
  el.dataset.kind  = kind;
  el.innerHTML     = `
    <span class="fi-icon">+</span>
    <span class="fi-name">${field.label}</span>
    <span class="fi-type">${field.typeTag}</span>`;
  el.addEventListener("click", () => {
    if (kind === "dim") addRowGroup(field.key);
    else               addValMetric(field.key);
  });
  return el;
}

function refreshSidebarInUse() {
  document.querySelectorAll("#dims-list .field-item").forEach(el => {
    el.classList.toggle("in-use", ST.rowGroups.includes(el.dataset.key));
  });
  document.querySelectorAll("#metrics-list .field-item").forEach(el => {
    el.classList.toggle("in-use", ST.valMetrics.some(m => m.key === el.dataset.key));
  });
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     DATASET SELECTION
════════════════════════════════════════════════════════════ -->
<script>
async function selectDataset(key) {
  if (ST.dsKey === key && ST.loadStatus === "ready") return;

  ST.dsKey      = key;
  ST.records    = [];
  ST.rowGroups  = [];
  ST.valMetrics = [];
  ST.filters    = [];
  ST.results    = [];
  ST.loadStatus = "loading";

  // Active card
  document.querySelectorAll(".ds-card").forEach(c =>
    c.classList.toggle("active", c.dataset.key === key));

  // Show UI chrome
  document.getElementById("config-panel").style.display = "";
  document.getElementById("filter-bar").style.display   = "flex";
  document.getElementById("btn-run").disabled            = false;
  document.getElementById("btn-export").disabled         = true;

  renderSidebarFields(CATALOG[key]);
  renderConfig();
  showLoading("Loading " + CATALOG[key].label + "…");

  try {
    ST.records    = await CATALOG[key].load();
    ST.loadStatus = "ready";

    // Auto-detect schema for dynamic datasets that have no declared fields.
    const entry = CATALOG[key];
    if (ST.records.length && entry._dynamic &&
        !entry.dimensions.length && !entry.metrics.length) {
      const { dimensions, metrics } = DatasetLoader.inferSchema(ST.records[0]);
      entry.dimensions = dimensions;
      entry.metrics    = [
        { key: "_count", label: "# Rows", typeTag: "count", defaultAgg: "count" },
        ...metrics,
      ];
      renderSidebarFields(entry);
    }

    // Update count badge
    const badge = document.getElementById("ds-count-" + key);
    if (badge) {
      badge.textContent   = ST.records.length.toLocaleString() + " rows available";
      badge.style.display = "block";
      badge.closest(".ds-card").classList.add("loaded");
    }
    showEmptyState("Choose dimensions & metrics above, then click Run.");
  } catch (err) {
    ST.loadStatus = "error";
    showEmptyState("⚠️ Failed to load dataset: " + err.message);
    document.getElementById("btn-run").disabled = true;
  }
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     CONFIG: ROW GROUPS & VALUE METRICS
════════════════════════════════════════════════════════════ -->
<script>
function addRowGroup(key) {
  if (ST.rowGroups.includes(key)) return;
  ST.rowGroups.push(key);
  renderConfig();
}
function removeRowGroup(key) {
  ST.rowGroups = ST.rowGroups.filter(k => k !== key);
  renderConfig();
}
function addValMetric(key) {
  if (!ST.dsKey) return;
  const def = [...ds().dimensions, ...ds().metrics].find(f => f.key === key);
  if (!def) return;
  ST.valMetrics.push({ key, agg: def.defaultAgg || "count", label: def.label });
  renderConfig();
}
function removeValMetric(idx) {
  ST.valMetrics.splice(idx, 1);
  renderConfig();
}
function changeAgg(idx, agg) {
  ST.valMetrics[idx].agg = agg;
}

function renderConfig() {
  if (!ST.dsKey) return;
  const rgPills  = document.getElementById("rg-pills");
  const valPills = document.getElementById("val-pills");
  rgPills.innerHTML  = "";
  valPills.innerHTML = "";

  // Row group pills
  ST.rowGroups.forEach(key => {
    const def   = ds().dimensions.find(d => d.key === key);
    const label = def ? def.label : key;
    const pill  = document.createElement("div");
    pill.className = "pill pill-dim";
    const rm = document.createElement("button");
    rm.className   = "pill-rm";
    rm.textContent = "×";
    rm.addEventListener("click", () => removeRowGroup(key));
    pill.appendChild(document.createTextNode(label));
    pill.appendChild(rm);
    rgPills.appendChild(pill);
  });
  const addDim = document.createElement("button");
  addDim.className   = "add-pill";
  addDim.textContent = "+ dimension";
  addDim.onclick     = () => document.getElementById("sb-dims").scrollIntoView({ behavior: "smooth" });
  rgPills.appendChild(addDim);

  // Value metric pills
  ST.valMetrics.forEach((m, idx) => {
    const pill = document.createElement("div");
    pill.className   = "pill pill-metric";

    const sel = document.createElement("select");
    sel.className    = "agg-sel";
    AGG_OPTS.forEach(a => {
      const opt      = document.createElement("option");
      opt.value      = a;
      opt.textContent = AGG_LABEL[a];
      opt.selected   = a === m.agg;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", e => changeAgg(idx, e.target.value));

    const rm = document.createElement("button");
    rm.className   = "pill-rm";
    rm.textContent = "×";
    rm.addEventListener("click", () => removeValMetric(idx));

    pill.appendChild(sel);
    pill.appendChild(document.createTextNode(" " + m.label));
    pill.appendChild(rm);
    valPills.appendChild(pill);
  });
  const addMet = document.createElement("button");
  addMet.className   = "add-pill";
  addMet.textContent = "+ metric";
  addMet.onclick     = () => document.getElementById("sb-metrics").scrollIntoView({ behavior: "smooth" });
  valPills.appendChild(addMet);

  renderFilters();
  refreshSidebarInUse();
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     FILTERS
════════════════════════════════════════════════════════════ -->
<script>
function fieldMeta(key) {
  if (!ST.dsKey) return null;
  return [...ds().dimensions, ...ds().metrics].find(f => f.key === key) || null;
}

function addFilter() {
  if (!ST.dsKey) return;
  const fields = allFields();
  if (!fields.length) return;
  const first = fields[0];
  const defaultOp = first.typeTag === "date" ? "between" : "=";
  ST.filters.push({ id: ST.nextFid++, field: first.key, op: defaultOp, value: "", value2: "" });
  renderFilters();
}
function removeFilter(id) {
  ST.filters = ST.filters.filter(f => f.id !== id);
  renderFilters();
}

function renderFilters() {
  const container = document.getElementById("filter-chips");
  container.innerHTML = "";
  if (!ST.dsKey) return;
  const fields = allFields();

  ST.filters.forEach(f => {
    const chip = document.createElement("div");
    chip.className = "filter-chip";

    // Field select
    const fSel = document.createElement("select");
    fields.forEach(fd => {
      const o = document.createElement("option");
      o.value       = fd.key;
      o.textContent = fd.label;
      o.selected    = fd.key === f.field;
      fSel.appendChild(o);
    });
    fSel.addEventListener("change", e => {
      f.field = e.target.value;
      // Auto-switch to between when a date field is chosen
      const meta = fieldMeta(f.field);
      if (meta && meta.typeTag === "date" && f.op !== "between" &&
          f.op !== "is blank" && f.op !== "is not blank") {
        f.op = "between"; f.value = ""; f.value2 = "";
      }
      renderFilters();
    });

    const sep1 = document.createElement("span");
    sep1.className   = "fc-sep";
    sep1.textContent = " ";

    // Operator select
    const opSel = document.createElement("select");
    FILTER_OPS.forEach(op => {
      const o       = document.createElement("option");
      o.value       = o.textContent = op;
      o.selected    = op === f.op;
      opSel.appendChild(o);
    });

    // Value inputs (built after opSel so we can reference them in the change handler)
    const noVal  = f.op === "is blank" || f.op === "is not blank";
    const isBetween = f.op === "between";
    const meta   = fieldMeta(f.field);
    const isDate = meta && meta.typeTag === "date";

    function makeInput(val, placeholder, onInput) {
      const inp = document.createElement("input");
      inp.type        = isDate && (isBetween || ["=","≠",">","<","≥","≤"].includes(f.op)) ? "date" : "text";
      inp.placeholder = placeholder;
      inp.value       = val;
      inp.addEventListener("input", onInput);
      return inp;
    }

    const valInput  = makeInput(f.value,  "from", e => { f.value  = e.target.value; });
    const sep2      = document.createElement("span");
    sep2.className   = "fc-sep";
    sep2.textContent = "→";
    const valInput2 = makeInput(f.value2 || "", "to", e => { f.value2 = e.target.value; });

    if (noVal)     { valInput.style.display = "none"; sep2.style.display = "none"; valInput2.style.display = "none"; }
    if (!isBetween){ sep2.style.display = "none"; valInput2.style.display = "none"; }

    opSel.addEventListener("change", e => {
      f.op = e.target.value;
      renderFilters();
    });

    // Remove
    const rm = document.createElement("button");
    rm.className   = "pill-rm";
    rm.textContent = "×";
    rm.style.cssText = "margin-left:2px;";
    rm.addEventListener("click", () => removeFilter(f.id));

    chip.append(fSel, sep1, opSel, valInput, sep2, valInput2, rm);
    container.appendChild(chip);
  });
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     AGGREGATION ENGINE
════════════════════════════════════════════════════════════ -->
<script>
function applyFilters(records) {
  return records.filter(rec =>
    ST.filters.every(f => {
      const raw  = rec[f.field];
      const valS = String(raw  ?? "").toLowerCase();
      const fS   = String(f.value).toLowerCase();
      switch (f.op) {
        case "=":            return valS === fS;
        case "≠":            return valS !== fS;
        case "contains":     return valS.includes(fS);
        case "not contains": return !valS.includes(fS);
        case ">":            return Number(raw) >  Number(f.value);
        case "<":            return Number(raw) <  Number(f.value);
        case "≥":            return Number(raw) >= Number(f.value);
        case "≤":            return Number(raw) <= Number(f.value);
        case "between": {
          if (!f.value && !f.value2) return true;
          const d  = String(raw ?? "");
          const lo = f.value  || "";
          const hi = f.value2 || "";
          if (lo && hi) return d >= lo && d <= hi;
          if (lo)       return d >= lo;
          if (hi)       return d <= hi;
          return true;
        }
        case "is blank":     return raw === null || raw === undefined || raw === "";
        case "is not blank": return raw !== null  && raw !== undefined && raw !== "";
        default:             return true;
      }
    })
  );
}

function aggregateVal(records, key, agg) {
  if (agg === "count")  return records.length;
  if (agg === "countd") return new Set(records.map(r => r[key])).size;
  const vals = records.map(r => parseFloat(r[key])).filter(v => isFinite(v));
  if (!vals.length) return null;
  switch (agg) {
    case "sum": return vals.reduce((a, b) => a + b, 0);
    case "avg": return vals.reduce((a, b) => a + b, 0) / vals.length;
    case "min": return Math.min(...vals);
    case "max": return Math.max(...vals);
  }
  return null;
}

function buildTable(filtered) {
  // No grouping — return raw rows (capped)
  if (!ST.rowGroups.length && !ST.valMetrics.length) {
    return { rows: filtered.slice(0, 500), isRaw: true };
  }

  const groups = new Map();
  for (const rec of filtered) {
    const gk = ST.rowGroups.map(k => String(rec[k] ?? "")).join("\x00");
    if (!groups.has(gk)) {
      const dims = {};
      ST.rowGroups.forEach(k => { dims[k] = rec[k]; });
      groups.set(gk, { dims, recs: [] });
    }
    groups.get(gk).recs.push(rec);
  }

  const rows = [];
  for (const [, g] of groups) {
    const row = { ...g.dims };
    ST.valMetrics.forEach(m => {
      row[colKey(m)] = aggregateVal(g.recs, m.key, m.agg);
    });
    rows.push(row);
  }
  return { rows, isRaw: false };
}

function runQuery() {
  const filtered      = applyFilters(ST.records);
  const { rows, isRaw } = buildTable(filtered);
  ST.results = rows;
  ST.page    = 0;
  return { isRaw, filteredCount: filtered.length };
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     RENDER: TABLE & BAR CHART
════════════════════════════════════════════════════════════ -->
<script>
function getColumns(isRaw) {
  if (isRaw || (!ST.rowGroups.length && !ST.valMetrics.length)) {
    const sample = ST.results[0] || {};
    return Object.keys(sample).map(k => ({
      key: k, label: k, isMetric: typeof sample[k] === "number"
    }));
  }
  return [
    ...ST.rowGroups.map(k => {
      const def = ds().dimensions.find(d => d.key === k);
      return { key: k, label: def ? def.label : k, isMetric: false };
    }),
    ...ST.valMetrics.map(m => ({
      key: colKey(m), label: colLabel(m), isMetric: true
    })),
  ];
}

function fmtVal(v) {
  if (v === null || v === undefined) return null;
  if (!isFinite(v))                  return String(v);
  if (Number.isInteger(v) || Math.abs(v) >= 100)
    return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function sortResults(col) {
  if (ST.sortCol === col) {
    ST.sortDir = ST.sortDir === "asc" ? "desc" : "asc";
  } else {
    ST.sortCol = col;
    ST.sortDir = "asc";
  }
  ST.results.sort((a, b) => {
    const av = a[col], bv = b[col];
    if (av == null) return 1;
    if (bv == null) return -1;
    const diff = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv));
    return ST.sortDir === "asc" ? diff : -diff;
  });
  ST.page = 0;
  renderResults();
}

function renderResults(isRaw = false) {
  document.getElementById("empty-state").style.display    = "none";
  const panel = document.getElementById("results-content");
  panel.style.display = "flex";
  panel.innerHTML     = "";

  const total    = ST.results.length;
  const pages    = Math.ceil(total / ST.pageSize);
  const pageRows = ST.results.slice(ST.page * ST.pageSize, (ST.page + 1) * ST.pageSize);
  const cols     = getColumns(isRaw);

  // ── Toolbar ──
  const toolbar = document.createElement("div");
  toolbar.className = "results-toolbar";

  const count  = document.createElement("span");
  count.className   = "rc-count";
  count.innerHTML   = `<strong>${total.toLocaleString()}</strong> row${total !== 1 ? "s" : ""}`;

  const toggle = document.createElement("div");
  toggle.className  = "view-toggle";
  ["table","bar"].forEach(mode => {
    const b       = document.createElement("button");
    b.className   = "vt-btn" + (ST.viewMode === mode ? " active" : "");
    b.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
    b.onclick     = () => { ST.viewMode = mode; renderResults(isRaw); };
    toggle.appendChild(b);
  });

  const sp = document.createElement("span");
  sp.className = "res-spacer";

  const expBtn = document.createElement("button");
  expBtn.className   = "export-btn";
  expBtn.innerHTML   = "↓ Export CSV";
  expBtn.onclick     = exportCSV;

  toolbar.append(count, toggle, sp, expBtn);
  panel.appendChild(toolbar);

  // ── Content ──
  if (ST.viewMode === "bar") {
    renderBarChart(panel, cols, pageRows);
  } else {
    renderTable(panel, cols, pageRows);
  }

  // ── Pagination ──
  if (pages > 1) {
    const pag = document.createElement("div");
    pag.className = "pagination";

    const prev = document.createElement("button");
    prev.className   = "pg-btn";
    prev.textContent = "← Prev";
    prev.disabled    = ST.page === 0;
    prev.onclick     = () => { ST.page--; renderResults(isRaw); };

    const info = document.createElement("span");
    info.className   = "pg-info";
    info.textContent = `Page ${ST.page + 1} / ${pages}`;

    const next = document.createElement("button");
    next.className   = "pg-btn";
    next.textContent = "Next →";
    next.disabled    = ST.page >= pages - 1;
    next.onclick     = () => { ST.page++; renderResults(isRaw); };

    pag.append(prev, info, next);
    panel.appendChild(pag);
  }

  document.getElementById("btn-export").disabled = false;
}

function renderTable(panel, cols, rows) {
  const wrap  = document.createElement("div");
  wrap.className  = "table-wrap";
  const table = document.createElement("table");

  // Head
  const thead = document.createElement("thead");
  const hr    = document.createElement("tr");
  cols.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label;
    if (ST.sortCol === col.key) th.classList.add("sort-" + ST.sortDir);
    th.addEventListener("click", () => sortResults(col.key));
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    cols.forEach(col => {
      const td  = document.createElement("td");
      const raw = row[col.key];
      if (col.isMetric) {
        td.className = "num";
        if (raw === null || raw === undefined) {
          td.className += " null-cell";
          td.textContent = "—";
        } else {
          td.textContent = fmtVal(raw);
        }
      } else {
        td.textContent = raw === null || raw === undefined ? "" : String(raw);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  // Totals
  if (ST.valMetrics.length && ST.results.length) {
    const tfoot  = document.createElement("tfoot");
    const totRow = document.createElement("tr");
    cols.forEach((col, i) => {
      const td = document.createElement("td");
      if (!col.isMetric) {
        td.textContent = i === 0 ? "TOTAL" : "";
      } else {
        td.className = "num";
        const mi = i - ST.rowGroups.length;
        const m  = ST.valMetrics[mi];
        if (!m) { td.textContent = ""; }
        else if (m.agg === "avg") {
          const vals = ST.results.map(r => r[col.key]).filter(v => v !== null && isFinite(v));
          const avg  = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
          td.textContent = avg !== null ? fmtVal(avg) : "—";
        } else if (m.agg === "sum" || m.agg === "count") {
          const sum = ST.results.reduce((acc, r) => acc + (Number(r[col.key]) || 0), 0);
          td.textContent = fmtVal(sum);
        } else {
          td.textContent = "";
        }
      }
      totRow.appendChild(td);
    });
    tfoot.appendChild(totRow);
    table.appendChild(tfoot);
  }

  wrap.appendChild(table);
  panel.appendChild(wrap);
}

function renderBarChart(panel, cols, rows) {
  const metCols = cols.filter(c => c.isMetric);
  if (!metCols.length) {
    const note = document.createElement("p");
    note.style.cssText = "color:var(--muted);padding:20px;font-size:13px;";
    note.textContent   = "Add at least one metric to view a bar chart.";
    panel.appendChild(note);
    return;
  }
  const mc     = metCols[0];
  const dimCol = cols.find(c => !c.isMetric);
  const maxVal = Math.max(...rows.map(r => Number(r[mc.key]) || 0), 1);

  const wrap = document.createElement("div");
  wrap.className = "bar-chart-wrap";

  rows.forEach(row => {
    const val  = Number(row[mc.key]) || 0;
    const pct  = (val / maxVal) * 100;
    const lbl  = dimCol ? String(row[dimCol.key] ?? "—") : "—";
    const div  = document.createElement("div");
    div.className = "bar-row";
    div.innerHTML = `
      <div class="br-label" title="${lbl}">${lbl}</div>
      <div class="br-track">
        <div class="br-fill" style="width:${pct.toFixed(1)}%"></div>
      </div>
      <div class="br-value">${fmtVal(val)}</div>`;
    wrap.appendChild(div);
  });

  panel.appendChild(wrap);
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     CSV EXPORT
════════════════════════════════════════════════════════════ -->
<script>
function exportCSV() {
  if (!ST.results.length) return;
  const cols = getColumns(false);
  const header = cols.map(c => `"${c.label.replace(/"/g, '""')}"`).join(",");
  const body   = ST.results.map(row =>
    cols.map(c => {
      const v = row[c.key];
      if (v === null || v === undefined) return "";
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(",")
  ).join("\n");

  const ts   = new Date().toISOString().slice(0, 10);
  const blob = new Blob([header + "\n" + body], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `explore_${ST.dsKey}_${ts}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

<!-- ═══════════════════════════════════════════════════════════
     UI STATE HELPERS & BUTTON WIRING
════════════════════════════════════════════════════════════ -->
<script>
function showEmptyState(msg) {
  const es = document.getElementById("empty-state");
  es.style.display = "flex";
  es.innerHTML = `
    <div class="es-icon">🔍</div>
    <div class="es-title">Ready</div>
    <div class="es-desc">${msg}</div>`;
  document.getElementById("results-content").style.display = "none";
}

function showLoading(msg) {
  const es = document.getElementById("empty-state");
  es.style.display = "flex";
  es.innerHTML = `
    <div class="spinner"></div>
    <div class="es-title" style="margin-top:14px;">${msg}</div>`;
  document.getElementById("results-content").style.display = "none";
}

// Run
document.getElementById("btn-run").addEventListener("click", () => {
  if (!ST.dsKey || !ST.records.length) return;
  ST.sortCol = null;
  ST.sortDir = "asc";
  const { isRaw } = runQuery();
  if (!ST.results.length) {
    showEmptyState("No rows matched the current filters.");
    document.getElementById("btn-export").disabled = true;
    return;
  }
  renderResults(isRaw);
});

// Clear
document.getElementById("btn-clear").addEventListener("click", () => {
  if (!ST.dsKey) return;
  ST.rowGroups  = [];
  ST.valMetrics = [];
  ST.filters    = [];
  ST.results    = [];
  ST.sortCol    = null;
  renderConfig();
  showEmptyState("Choose dimensions & metrics above, then click Run.");
  document.getElementById("btn-export").disabled = true;
});

// Export (top-bar button)
document.getElementById("btn-export").addEventListener("click", exportCSV);
</script>

</body>
</html>
