<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T&L Digital — POD Analytics</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ---- Viewer Mode ---- */
    body.viewer-active { overflow: hidden; }

    .viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      background: var(--color-bg);
    }
    .viewer-overlay.open { display: flex; }

    /* Top nav bar */
    .viewer-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .viewer-nav .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text-muted);
      font-size: 0.825rem;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .viewer-nav .nav-btn:hover:not(:disabled) {
      background: var(--color-primary-light);
      color: var(--color-primary);
      border-color: var(--color-primary);
    }
    .viewer-nav .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .viewer-title {
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-counter {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    /* Iframe */
    .viewer-frame {
      flex: 1;
      border: none;
      width: 100%;
      background: #fff;
    }
  </style>
</head>
<body>
  <!-- ====== Table of Contents View ====== -->
  <header class="site-header">
    <h1>T&amp;L Digital POD Analytics</h1>
    <p class="subtitle">Print-on-Demand Analytics Warehouse</p>
  </header>

  <main>
    <section class="section">
      <h2>Dashboards</h2>
      <ul class="toc-list" id="toc-list">
        <!-- Populated by JS from DASHBOARDS array -->
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>T&amp;L Digital &copy; <span id="year"></span></p>
  </footer>

  <!-- ====== Dashboard Viewer Overlay ====== -->
  <div class="viewer-overlay" id="viewer">
    <nav class="viewer-nav">
      <button class="nav-btn" id="btn-back" title="Back to dashboard list">&#8592; All Dashboards</button>
      <button class="nav-btn" id="btn-prev" title="Previous dashboard">&#8592; Prev</button>
      <span class="viewer-title" id="viewer-title"></span>
      <span class="viewer-counter" id="viewer-counter"></span>
      <button class="nav-btn" id="btn-next" title="Next dashboard">Next &#8594;</button>
    </nav>
    <iframe class="viewer-frame" id="viewer-frame" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>

  <script>
    // ── Dashboard registry ──
    const DASHBOARDS = [
      {
        file: "2026 Digital Portfolio Initiative Dashboard V0.2.html",
        title: "2026 Digital Initiatives",
        desc: "Executive view of 2026 digital portfolio initiatives"
      },
      {
        file: "CW_Survey_Feedback_Dashboard_v2.html",
        title: "Club Wyndham Survey Feedback",
        desc: "Club Wyndham survey feedback analysis and insights"
      },
      {
        file: "SIR Sales Performance Dashboard V0.3.html",
        title: "SIR Sales Performance",
        desc: "Sports Illustrated Resorts sales performance metrics"
      },
      {
        file: "voya-dashboard-v3.html",
        title: "Voya Dashboard",
        desc: "Sales, fulfillment, and product performance for the Voya storefront"
      }
    ];

    // ── DOM refs ──
    const tocList      = document.getElementById("toc-list");
    const viewer       = document.getElementById("viewer");
    const viewerFrame  = document.getElementById("viewer-frame");
    const viewerTitle  = document.getElementById("viewer-title");
    const viewerCounter= document.getElementById("viewer-counter");
    const btnBack      = document.getElementById("btn-back");
    const btnPrev      = document.getElementById("btn-prev");
    const btnNext      = document.getElementById("btn-next");

    let currentIndex = -1;

    // ── Build TOC ──
    DASHBOARDS.forEach(function (d, i) {
      var li = document.createElement("li");
      var a  = document.createElement("a");
      a.href = "#";
      a.className = "toc-link";
      a.innerHTML =
        '<span class="toc-title">' + d.title + '</span>' +
        '<span class="toc-desc">' + d.desc + '</span>';
      a.addEventListener("click", function (e) {
        e.preventDefault();
        openDashboard(i);
      });
      li.appendChild(a);
      tocList.appendChild(li);
    });

    // ── Open / close / navigate ──
    function openDashboard(index) {
      currentIndex = index;
      var d = DASHBOARDS[index];
      viewerFrame.src = d.file;
      viewerTitle.textContent = d.title;
      viewerCounter.textContent = (index + 1) + " / " + DASHBOARDS.length;
      btnPrev.disabled = (index === 0);
      btnNext.disabled = (index === DASHBOARDS.length - 1);
      viewer.classList.add("open");
      document.body.classList.add("viewer-active");
      history.pushState({ dashboard: index }, "", "#" + encodeURIComponent(d.file));
    }

    function closeDashboard() {
      viewer.classList.remove("open");
      document.body.classList.remove("viewer-active");
      viewerFrame.src = "about:blank";
      currentIndex = -1;
      history.pushState({}, "", window.location.pathname);
    }

    btnBack.addEventListener("click", closeDashboard);
    btnPrev.addEventListener("click", function () {
      if (currentIndex > 0) openDashboard(currentIndex - 1);
    });
    btnNext.addEventListener("click", function () {
      if (currentIndex < DASHBOARDS.length - 1) openDashboard(currentIndex + 1);
    });

    // ── Keyboard shortcuts ──
    document.addEventListener("keydown", function (e) {
      if (currentIndex === -1) return;
      if (e.key === "Escape") closeDashboard();
      if (e.key === "ArrowLeft" && currentIndex > 0) openDashboard(currentIndex - 1);
      if (e.key === "ArrowRight" && currentIndex < DASHBOARDS.length - 1) openDashboard(currentIndex + 1);
    });

    // ── Handle browser back/forward ──
    window.addEventListener("popstate", function (e) {
      if (e.state && typeof e.state.dashboard === "number") {
        openDashboard(e.state.dashboard);
      } else {
        viewer.classList.remove("open");
        document.body.classList.remove("viewer-active");
        viewerFrame.src = "about:blank";
        currentIndex = -1;
      }
    });

    // ── Deep-link on load ──
    if (window.location.hash) {
      var file = decodeURIComponent(window.location.hash.slice(1));
      var idx = DASHBOARDS.findIndex(function (d) { return d.file === file; });
      if (idx !== -1) openDashboard(idx);
    }

    // ── Footer year ──
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
