<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T&L Digital — POD Analytics</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>T&amp;L Digital POD Analytics</h1>
    <p class="subtitle">Print-on-Demand Performance Dashboard</p>
    <nav class="site-nav">
      <a href="index.html" class="nav-link active">Overview</a>
      <a href="voya-dashboard-v3.html" class="nav-link">Voya Dashboard</a>
    </nav>
  </header>

  <main>
    <!-- Status bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-message"></span>
    </div>

    <!-- KPI Cards -->
    <section class="section">
      <h2>Key Metrics</h2>
      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card loading">
          <div class="kpi-label">Total Orders</div>
          <div class="kpi-value" id="kpi-orders">—</div>
        </div>
        <div class="kpi-card loading">
          <div class="kpi-label">Total Revenue</div>
          <div class="kpi-value" id="kpi-revenue">—</div>
        </div>
        <div class="kpi-card loading">
          <div class="kpi-label">Fulfillment Rate</div>
          <div class="kpi-value" id="kpi-fulfillment">—</div>
        </div>
        <div class="kpi-card loading">
          <div class="kpi-label">Active Products</div>
          <div class="kpi-value" id="kpi-products">—</div>
        </div>
      </div>
    </section>

    <!-- Orders Table -->
    <section class="section">
      <h2>Recent Orders</h2>
      <div class="table-wrapper">
        <table id="orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Source</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="5" class="loading-row">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Revenue by Source -->
    <section class="section">
      <h2>Revenue by Source</h2>
      <div id="revenue-chart" class="bar-chart"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>T&amp;L Digital &copy; <span id="year"></span></p>
  </footer>

  <!-- Load JS modules in dependency order -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
