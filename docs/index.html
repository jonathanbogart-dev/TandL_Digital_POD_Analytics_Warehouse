<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T&L Digital — Analytics Hub</title>
  <style>
    :root {
      --navy:   #17294D;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --bg:     #EEF2F7;
      --surface:#FFFFFF;
      --surface-alt:#F4F7FA;
      --border: #DDE3ED;
      --border-strong:#B8C4D8;
      --text:   #0F172A;
      --text-2: #334155;
      --muted:  #4B5E76;
      --sb-text:#E2E8F0;
      --sb-text-2:#B0BFCF;
      --sb-label:#8FA6BF;
      --sb-border:rgba(255,255,255,.10);
      --sh: 0 2px 12px rgba(0,0,0,.08);
      --sh-card: 0 4px 20px rgba(0,0,0,.07);
      --r: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="dark"] {
      --navy:   #0F172A;
      --accent: #3B82F6;
      --accent-light: rgba(59,130,246,.12);
      --bg:     #0B1120;
      --surface:#151D2E;
      --surface-alt:#1A2438;
      --border: rgba(148,163,184,.15);
      --border-strong:rgba(148,163,184,.25);
      --text:   #E2E8F0;
      --text-2: #CBD5E1;
      --muted:  #94A3B8;
      --sh: 0 2px 16px rgba(0,0,0,.35);
      --sh-card:0 4px 24px rgba(0,0,0,.30);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    /* ── Top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      height: 56px;
      background: var(--navy);
      box-shadow: 0 2px 8px rgba(0,0,0,.20);
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; color: #fff;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 15px; font-weight: 800; color: var(--sb-text);
    }
    .brand-sep {
      color: rgba(255,255,255,.25);
      font-size: 18px;
      font-weight: 200;
      padding: 0 2px;
    }
    .brand-sub {
      font-size: 13px; font-weight: 500; color: var(--sb-text-2);
    }
    .topbar-spacer { flex: 1; }
    .theme-toggle {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--sb-text-2);
      transition: background .2s;
    }
    .theme-toggle:hover { background: rgba(255,255,255,.12); }
    .icon-sun { display: none; }
    .icon-moon { display: inline; }
    [data-theme="dark"] .icon-sun  { display: inline; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* ── Page content ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 40px 24px 64px; }

    .page-hero { margin-bottom: 36px; }
    .page-hero h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -.02em;
      color: var(--text); margin-bottom: 6px;
    }
    .page-hero p { font-size: 14px; color: var(--muted); }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .section-header h2 {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted);
    }
    .section-line {
      flex: 1; height: 1px; background: var(--border);
    }
    .badge-count {
      font-size: 11px; font-weight: 700;
      background: var(--accent-light); color: var(--accent);
      border: 1px solid rgba(37,99,235,.20);
      border-radius: 9999px; padding: 1px 8px;
    }

    /* ── Dashboard card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .dash-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 22px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--sh-card);
      transition: border-color .18s, box-shadow .18s, transform .18s;
      position: relative;
      overflow: hidden;
    }
    .dash-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .18s;
    }
    .dash-card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 28px rgba(37,99,235,.15);
      transform: translateY(-2px);
    }
    .dash-card:hover::before { opacity: 1; }

    .card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .card-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--accent-light);
      border: 1px solid rgba(37,99,235,.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .card-arrow {
      color: var(--muted); font-size: 18px; line-height: 1;
      transition: color .18s, transform .18s;
      padding-top: 2px;
    }
    .dash-card:hover .card-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .card-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      line-height: 1.35;
    }
    .card-desc {
      font-size: 12.5px; color: var(--muted); line-height: 1.5;
    }

    /* ── Footer ── */
    .site-footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
    }

    /* ── Viewer overlay ── */
    body.viewer-active { overflow: hidden; }

    .viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      flex-direction: column;
      background: var(--bg);
    }
    .viewer-overlay.open { display: flex; }

    .viewer-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 52px;
      background: var(--navy);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.20);
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 7px;
      background: rgba(255,255,255,.06);
      color: var(--sb-text-2);
      font-size: 12.5px;
      font-family: var(--font);
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.14);
      color: #fff;
    }
    .nav-btn:disabled { opacity: .35; cursor: default; }

    .viewer-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--sb-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .viewer-counter {
      font-size: 11.5px;
      color: var(--sb-text-2);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9999px;
      padding: 2px 10px;
      white-space: nowrap;
    }

    .viewer-frame { flex: 1; border: none; width: 100%; background: #fff; }
  </style>
</head>
<body>

  <!-- ── Top bar ── -->
  <div class="topbar">
    <div class="brand-icon">T</div>
    <span class="brand-name">T&amp;L Digital</span>
    <span class="brand-sep">|</span>
    <span class="brand-sub">Analytics Hub</span>
    <div class="topbar-spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </div>

  <!-- ── Main page ── -->
  <main class="page">
    <div class="page-hero">
      <h1>Dashboard Library</h1>
      <p>Select a dashboard below to explore. Use arrow keys or the navigation bar to move between dashboards.</p>
    </div>

    <div class="section-header">
      <h2>Dashboards</h2>
      <div class="section-line"></div>
      <span class="badge-count" id="dash-count">0</span>
    </div>

    <div class="card-grid" id="card-grid">
      <!-- Populated by JS -->
    </div>
  </main>

  <footer class="site-footer">
    T&amp;L Digital &copy; <span id="year"></span>
  </footer>

  <!-- ── Dashboard viewer overlay ── -->
  <div class="viewer-overlay" id="viewer">
    <nav class="viewer-nav">
      <button class="nav-btn" id="btn-back">&#8592; All Dashboards</button>
      <button class="nav-btn" id="btn-prev">&#8592; Prev</button>
      <span class="viewer-title" id="viewer-title"></span>
      <span class="viewer-counter" id="viewer-counter"></span>
      <button class="nav-btn" id="btn-next">Next &#8594;</button>
    </nav>
    <iframe class="viewer-frame" id="viewer-frame" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>

  <script>
    // ── Dashboard registry ──
    const DASHBOARDS = [
      {
        file:  "2026 Digital Portfolio Initiative Dashboard V0.2.html",
        title: "2026 Digital Initiatives",
        desc:  "Executive view of 2026 digital portfolio initiatives",
        icon:  "📊"
      },
      {
        file:  "CW_Survey_Feedback_Dashboard_v2.html",
        title: "Club Wyndham Survey Feedback",
        desc:  "Club Wyndham survey feedback analysis and insights",
        icon:  "📋"
      },
      {
        file:  "SIR Sales Performance Dashboard V0.3.html",
        title: "SIR Sales Performance",
        desc:  "Sports Illustrated Resorts sales performance metrics",
        icon:  "📈"
      },
      {
        file:  "voya-dashboard-v3.html",
        title: "Voya Dashboard",
        desc:  "Sales, fulfillment, and product performance for the Voya storefront",
        icon:  "🏪"
      }
    ];

    // ── DOM refs ──
    const cardGrid     = document.getElementById("card-grid");
    const dashCount    = document.getElementById("dash-count");
    const viewer       = document.getElementById("viewer");
    const viewerFrame  = document.getElementById("viewer-frame");
    const viewerTitle  = document.getElementById("viewer-title");
    const viewerCounter= document.getElementById("viewer-counter");
    const btnBack      = document.getElementById("btn-back");
    const btnPrev      = document.getElementById("btn-prev");
    const btnNext      = document.getElementById("btn-next");

    let currentIndex = -1;

    // ── Build cards ──
    dashCount.textContent = DASHBOARDS.length;
    DASHBOARDS.forEach(function(d, i) {
      var card = document.createElement("a");
      card.href = "#";
      card.className = "dash-card";
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-icon">' + d.icon + '</div>' +
          '<span class="card-arrow">&#8594;</span>' +
        '</div>' +
        '<div class="card-title">' + d.title + '</div>' +
        '<div class="card-desc">' + d.desc + '</div>';
      card.addEventListener("click", function(e) {
        e.preventDefault();
        openDashboard(i);
      });
      cardGrid.appendChild(card);
    });

    // ── Open / close / navigate ──
    function openDashboard(index) {
      currentIndex = index;
      var d = DASHBOARDS[index];
      viewerFrame.src = d.file;
      viewerTitle.textContent = d.title;
      viewerCounter.textContent = (index + 1) + " / " + DASHBOARDS.length;
      btnPrev.disabled = (index === 0);
      btnNext.disabled = (index === DASHBOARDS.length - 1);
      viewer.classList.add("open");
      document.body.classList.add("viewer-active");
      history.pushState({ dashboard: index }, "", "#" + encodeURIComponent(d.file));
    }

    function closeDashboard() {
      viewer.classList.remove("open");
      document.body.classList.remove("viewer-active");
      viewerFrame.src = "about:blank";
      currentIndex = -1;
      history.pushState({}, "", window.location.pathname);
    }

    btnBack.addEventListener("click", closeDashboard);
    btnPrev.addEventListener("click", function() { if (currentIndex > 0) openDashboard(currentIndex - 1); });
    btnNext.addEventListener("click", function() { if (currentIndex < DASHBOARDS.length - 1) openDashboard(currentIndex + 1); });

    // ── Keyboard shortcuts ──
    document.addEventListener("keydown", function(e) {
      if (currentIndex === -1) return;
      if (e.key === "Escape")     closeDashboard();
      if (e.key === "ArrowLeft"  && currentIndex > 0)                     openDashboard(currentIndex - 1);
      if (e.key === "ArrowRight" && currentIndex < DASHBOARDS.length - 1) openDashboard(currentIndex + 1);
    });

    // ── Browser back/forward ──
    window.addEventListener("popstate", function(e) {
      if (e.state && typeof e.state.dashboard === "number") {
        openDashboard(e.state.dashboard);
      } else {
        viewer.classList.remove("open");
        document.body.classList.remove("viewer-active");
        viewerFrame.src = "about:blank";
        currentIndex = -1;
      }
    });

    // ── Deep-link on load ──
    if (window.location.hash) {
      var file = decodeURIComponent(window.location.hash.slice(1));
      var idx = DASHBOARDS.findIndex(function(d) { return d.file === file; });
      if (idx !== -1) openDashboard(idx);
    }

    // ── Dark mode toggle ──
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    document.getElementById("theme-toggle").addEventListener("click", function() {
      var current = document.documentElement.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });

    // ── Footer year ──
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
