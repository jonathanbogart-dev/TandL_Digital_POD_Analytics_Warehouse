name: pod_analytics
version: "1.0.0"
config-version: 2

profile: pod_analytics

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]
macro-paths: ["macros"]
docs-paths:  ["docs"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

models:
  pod_analytics:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: ephemeral

    marts:
      +materialized: table
      +schema: marts

vars:
  # Override at run-time: dbt run --vars '{"start_date": "2024-01-01"}'
  start_date: "2024-01-01"
  currency: "USD"
